<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseball Analytics Test Box</title>
</head>

<body style="
    background-color: #f8f9fa;
    font-family: Arial, sans-serif;
    padding: 40px;
">

    <div style="
        max-width: 450px;
        margin: 0 auto;
        padding: 20px;
        background: white;
        border-radius: 8px;
        border: 1px solid #ddd;
        text-align: center;
    ">

        <h3>⚾ Swing Data Connection Box</h3>

        <p style="
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        ">
            Testing file transmission from GitHub Pages to Make.com.
        </p>

        <input
            type="file"
            id="swingVideoInput"
            accept="video/*"
            style="
                margin: 20px 0;
                display: block;
                width: 100%;
            "
        >

        <button
            id="uploadBtn"
            type="button"
            style="
                background: #007bff;
                color: white;
                border: none;
                padding: 12px;
                width: 100%;
                font-size: 16px;
                font-weight: bold;
                border-radius: 4px;
                cursor: pointer;
            "
        >
            Send Test File
        </button>

        <p
            id="statusText"
            style="
                margin-top: 15px;
                font-weight: bold;
                color: #555;
                word-break: break-word;
            "
        ></p>

    </div>

    <script>
        // IMPORTANT:
        // Replace this with the EXACT Custom Webhook URL
        // copied from Make.com.
        const WEBHOOK_URL = "PASTE_YOUR_REAL_MAKE_WEBHOOK_URL_HERE";

        const fileInput = document.getElementById("swingVideoInput");
        const uploadButton = document.getElementById("uploadBtn");
        const status = document.getElementById("statusText");

        uploadButton.addEventListener("click", uploadSwingVideo);

        async function uploadSwingVideo() {

            // Make sure a file was actually selected.
            if (!fileInput.files || fileInput.files.length === 0) {
                status.textContent = "❌ Please select a video first.";
                status.style.color = "#dc3545";
                return;
            }

            // IMPORTANT:
            // files[0] is the actual File object.
            const file = fileInput.files[0];

            // Basic sanity check.
            console.log("Selected file:", file.name);
            console.log("File type:", file.type);
            console.log("File size:", file.size, "bytes");

            const sizeMB = file.size / (1024 * 1024);

            status.textContent =
                `Preparing ${file.name} (${sizeMB.toFixed(2)} MB)...`;

            status.style.color = "#007bff";

            uploadButton.disabled = true;
            uploadButton.style.opacity = "0.6";
            uploadButton.style.cursor = "wait";

            try {

                /*
                 * FormData automatically creates the correct
                 * multipart/form-data boundary.
                 *
                 * DO NOT manually set:
                 *
                 * headers: {
                 *     "Content-Type": "multipart/form-data"
                 * }
                 *
                 * Doing that can break the multipart boundary.
                 */
                const formData = new FormData();

                // Make expects the uploaded file under "file".
                formData.append("file", file, file.name);

                // Optional metadata.
                formData.append("filename", file.name);
                formData.append("filesize", String(file.size));
                formData.append("filetype", file.type || "application/octet-stream");

                status.textContent = "⬆️ Uploading video to Make.com...";

                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    body: formData
                });

                console.log("Make response status:", response.status);

                if (!response.ok) {
                    throw new Error(
                        `Make returned HTTP ${response.status}`
                    );
                }

                status.textContent =
                    "✅ Upload successful! Make.com accepted the request.";

                status.style.color = "#28a745";

                console.log("Upload completed successfully.");

            } catch (error) {

                console.error("Upload error:", error);

                status.textContent =
                    "❌ Upload failed. Open the browser Console (F12) for details.";

                status.style.color = "#dc3545";

            } finally {

                uploadButton.disabled = false;
                uploadButton.style.opacity = "1";
                uploadButton.style.cursor = "pointer";
            }
        }
    </script>

</body>
</html>
</body>
</html>
